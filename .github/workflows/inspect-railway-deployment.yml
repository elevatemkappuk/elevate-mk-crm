name: Inspect Railway deployment event

on:
  deployment_status:

jobs:
  inspect-staging-deployment:
    # Temporary inspection only: the filter is intentionally disabled so we
    # can observe Railway's real deployment_status payload values before
    # enabling write-capable staging E2E validation.
    runs-on: ubuntu-latest
    steps:
      - name: Print safe deployment metadata
        env:
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_STATUS_ID: ${{ github.event.deployment_status.id }}
        run: |
          echo "deployment_status.state=$DEPLOYMENT_STATE"
          echo "deployment.environment=$DEPLOYMENT_ENVIRONMENT"
          echo "deployment.ref=$DEPLOYMENT_REF"
          echo "deployment.sha=$DEPLOYMENT_SHA"
          echo "deployment_status.environment_url=$DEPLOYMENT_ENVIRONMENT_URL"
          echo "deployment.id=$DEPLOYMENT_ID"
          echo "deployment_status.id=$DEPLOYMENT_STATUS_ID"
