<main class="auth-page"><section class="auth-card"><h1>Join Elevate MK staff</h1><p role="status">{{ message() }}</p>@if (state() === 'ready') { <form [formGroup]="form" (ngSubmit)="accept()">@if (existingAccount()) { <label>Email<input class="crm-control" type="email" formControlName="email" autocomplete="username"></label><label>Password<input class="crm-control" type="password" formControlName="password" autocomplete="current-password"></label> } @else { <label>Password<input class="crm-control" type="password" formControlName="password" autocomplete="new-password"></label><label>Confirm password<input class="crm-control" type="password" formControlName="confirm_password" autocomplete="new-password"></label> }<button class="crm-button crm-button--brand" type="submit">{{ existingAccount() ? 'Sign in and accept invitation' : 'Accept invitation' }}</button></form> }</section></main>
